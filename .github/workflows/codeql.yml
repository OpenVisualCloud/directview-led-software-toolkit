#
# CodeQL Advanced workflow for dvledtx (C/C++ project built with meson/ninja).
#
# The repository only contains C sources, so the language matrix is reduced to
# `c-cpp` with a manual build, reusing the environment-check/build-dvledtx
# composite actions so CodeQL traces the same build the rest of CI performs.
name: CodeQL Scan

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    # Weekly on Wednesday at 05:00 UTC
    - cron: '0 5 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write # Required to upload CodeQL results to the Security tab
      actions: read          # Required by CodeQL to read the workflow run on private repos

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Environment check
        uses: ./.github/actions/environment-check

      - name: CodeQL Scan
        uses: ./.github/actions/analysis/codeql
