name: Coverity Scan

on:
  schedule:
    # Weekly on Tuesday at 05:00 UTC
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverity:
    name: Coverity Scan (${{ github.event.repository.default_branch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to GitHub Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scanned commit
        id: scanned
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Environment check
        uses: $/.github/actions/environment-check

      - name: Coverity Scan
        uses: $/.github/actions/analysis/coverity
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_TOKEN }}
          COVERITY_EMAIL: ${{ secrets.COVERITY_EMAIL }}

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always()
        with:
          sarif_file: reports/coverity-results.sarif
          category: coverity
          # The workflow runs on the default branch, so the scanned ref must be stated explicitly.
          ref: refs/heads/${{ github.event.repository.default_branch }}
          sha: ${{ steps.scanned.outputs.sha }}
