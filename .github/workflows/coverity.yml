name: Coverity Scan

on:
  schedule:
    # Weekly on Tuesday at 05:00 UTC
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverity:
    name: Coverity Scan (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to GitHub Security tab
    strategy:
      fail-fast: false
      matrix:
        branch: [main, dev]

    steps:
      - name: Clean up previous run
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          find "$WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ matrix.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scanned commit
        id: scanned
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Environment check
        uses: ./.github/actions/environment-check

      - name: Coverity Scan
        uses: ./.github/actions/analysis/coverity
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_TOKEN }}
          COVERITY_EMAIL: ${{ secrets.COVERITY_EMAIL }}

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: reports/coverity-results.sarif
          category: coverity
          # The workflow runs on the default branch, so the scanned ref must be stated explicitly.
          ref: refs/heads/${{ matrix.branch }}
          sha: ${{ steps.scanned.outputs.sha }}
