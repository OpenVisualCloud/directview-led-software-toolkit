name: Daily Build

on:
  schedule:
    # Run at 10:00 PM UTC, Monday through Friday
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Daily Build (${{ github.event.repository.default_branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to GitHub Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Environment check
        uses: $/.github/actions/environment-check

      - name: Build
        uses: $/.github/actions/build-dvledtx

      - name: Smoke test
        uses: $/.github/actions/smoke-tests

      - name: Unit tests
        uses: $/.github/actions/unit-tests

      - name: ShellCheck
        uses: $/.github/actions/analysis/shellcheck

      - name: zizmor Scan
        uses: $/.github/actions/analysis/zizmor

      - name: cppcheck
        uses: $/.github/actions/analysis/cppcheck

      - name: Trivy Scan
        uses: $/.github/actions/analysis/trivy

      - name: checksec Analysis
        uses: $/.github/actions/analysis/checksec

      - name: Gitleaks Scan
        uses: $/.github/actions/analysis/gitleaks

      - name: Upload daily build reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: DVLED-SW-TK-DailyBuild-${{ github.event.repository.default_branch }}-${{ github.run_id }}
          path: ${{ github.workspace }}/reports/
          retention-days: 30

  afl-fuzz:
    name: Daily AFL Fuzz (${{ github.event.repository.default_branch }})
    runs-on: ubuntu-latest
    # 4h of TX+RX fuzzing plus headroom for dependency install and builds.
    timeout-minutes: 258
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: AFL Fuzz
        uses: $/.github/actions/analysis/afl-fuzz
        with:
          max-seconds: '7200'

      - name: Upload AFL fuzzing results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: afl-fuzz-results-${{ github.event.repository.default_branch }}-${{ github.run_id }}
          path: |
            dvledtx/fuzz/findings/
            dvledrx/fuzz/findings/
          retention-days: 14

  libfuzzer:
    name: Daily libFuzzer (${{ github.event.repository.default_branch }})
    runs-on: ubuntu-latest
    # max-seconds applies per target and sanitizer mode (TX+RX, ASan+UBSan),
    # so fuzzing takes ~4h; the rest covers the four builds.
    timeout-minutes: 258
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: libFuzzer
        uses: $/.github/actions/analysis/libfuzzer
        with:
          max-seconds: '3600'

      - name: Upload libFuzzer corpora
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libfuzzer-results-${{ github.event.repository.default_branch }}-${{ github.run_id }}
          path: |
            dvledtx/fuzz/libfuzzer_corpus/
            dvledtx/fuzz/ubsan_corpus/
            dvledrx/fuzz/libfuzzer_corpus/
            dvledrx/fuzz/ubsan_corpus/
          retention-days: 14


