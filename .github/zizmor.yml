rules:
  # In-repo actions use GitHub's self-repository syntax (uses: $/...), which
  # this audit already prefers, so the rule is a no-op today. It stays disabled
  # because the project has moved between '$/' and the workspace-relative './'
  # form, and the scan should not flip red on that choice alone: the audit is
  # informational (help severity) and the actions are owned by this repository.
  self-repository:
    disable: true
