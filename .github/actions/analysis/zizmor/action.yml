name: 'zizmor Scan'
description: 'Install zizmor and scan all GitHub Actions workflow and action files'

inputs:
  zizmor-version:
    description: >-
      Exact zizmor version to install. Keep in sync with the same input on the
      environment-check action, which may have installed zizmor already.
    required: false
    default: '1.30.1'

runs:
  using: composite
  steps:
    - name: Install zizmor
      shell: bash
      env:
        ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
      run: |
        echo "===== zizmor Setup ====="
        HAVE=$(zizmor --version 2>/dev/null | awk '{print $2}')
        if [ "$HAVE" = "$ZIZMOR_VERSION" ]; then
          echo "  [OK] zizmor already installed: $HAVE"
        else
          pip3 install --break-system-packages "zizmor==${ZIZMOR_VERSION}"
          echo "  zizmor installed: $(zizmor --version)"
        fi

    - name: zizmor scan
      shell: bash
      run: |
        REPORT_DIR="$GITHUB_WORKSPACE/reports"
        mkdir -p "$REPORT_DIR"
        echo "===== zizmor Workflow Security Scan ====="
        zizmor --pedantic --format sarif "$GITHUB_WORKSPACE" \
          > "$REPORT_DIR/zizmor-report.sarif" 2>&1 || ZIZMOR_EXIT=$?
        zizmor --pedantic "$GITHUB_WORKSPACE" \
          2>&1 | sed 's/\x1b\[[0-9;]*[mGKHF]//g' | tee "$REPORT_DIR/zizmor-scan.txt" || true
        echo "zizmor scan complete. Reports: $REPORT_DIR/zizmor-scan.txt, $REPORT_DIR/zizmor-report.sarif"
        exit "${ZIZMOR_EXIT:-0}"
